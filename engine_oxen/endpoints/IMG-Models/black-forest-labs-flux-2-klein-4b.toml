id = "black-forest-labs-flux-2-klein-4b"
label = "FLUX.2 Klein 4B"
category = "IMG"
platform = "oxen"
endpoint = "black-forest-labs-flux-2-klein-4b"
api_path = "api/ai/images/generate"
mode = "sync"
payload_style = "flat"
description = "FLUX.2 Klein 4B: compact, fast text-to-image with optional reference images."

[pricing]
note = "unset — read pricing from GET /api/ai/models/black-forest-labs-flux-2-klein-4b before shipping"

[general]
kind = "image"
prompt = "required"
image_url_param = "input_image"
media_lists = ["input_image"]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "1:1", label = "1:1" },
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "4:3", label = "4:3" },
  { value = "3:4", label = "3:4" },
]

[params.output_quality]
label = "Output Quality"
type = "select"
default = "standard"
options = [
  { value = "standard", label = "standard" },
  { value = "high", label = "high" },
]

[params.output_format]
label = "Output Format"
type = "select"
default = "png"
options = [
  { value = "png", label = "png" },
  { value = "jpg", label = "jpg" },
  { value = "webp", label = "webp" },
]

[params.num_inference_steps]
label = "Steps"
type = "integer"
default = 28
min = 1
max = 50

[params.guidance_scale]
label = "Guidance Scale"
type = "number"
default = 2.0
min = 0.0
max = 10.0

[params.seed]
label = "Seed"
type = "integer"
