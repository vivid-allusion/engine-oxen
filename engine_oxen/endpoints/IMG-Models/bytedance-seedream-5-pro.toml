id = "bytedance-seedream-5-pro"
label = "Seedream 5.0 Pro"
category = "IMG"
platform = "oxen"
endpoint = "bytedance-seedream-5-pro"
api_path = "api/ai/images/generate"
mode = "sync"
payload_style = "flat"
description = "Seedream 5.0 Pro: ByteDance text-to-image and multi-reference editing at 1K or 2K."

[pricing]
note = "unset — read pricing from GET /api/ai/models/bytedance-seedream-5-pro before shipping"

[general]
kind = "image"
prompt = "required"
image_url_param = "input_image"
media_lists = ["input_image"]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "1:1"
options = [
  { value = "1:1", label = "1:1" },
  { value = "4:3", label = "4:3" },
  { value = "3:4", label = "3:4" },
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "3:2", label = "3:2" },
  { value = "2:3", label = "2:3" },
  { value = "21:9", label = "21:9" },
]

[params.size]
label = "Size"
type = "select"
default = "2K"
options = [
  { value = "1K", label = "1K" },
  { value = "2K", label = "2K" },
]

[params.output_format]
label = "Output Format"
type = "select"
default = "png"
options = [
  { value = "png", label = "png" },
  { value = "jpeg", label = "jpeg" },
]

[params.watermark]
label = "Watermark"
type = "boolean"
default = false
