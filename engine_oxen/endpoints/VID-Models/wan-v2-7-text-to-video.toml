id = "wan-v2-7-text-to-video"
label = "WAN 2.7 (text to video)"
category = "VID"
platform = "oxen"
endpoint = "wan-v2-7-text-to-video"
api_path = "api/ai/queue"
mode = "async"
payload_style = "flat"
description = "WAN 2.7: text-to-video in Chinese or English, 2-15 s, optional audio input."

[pricing]
note = "unset — read pricing from GET /api/ai/models/wan-v2-7-text-to-video before shipping"

[general]
kind = "video"
prompt = "required"
image_url_param = "input_image"
duration_param_name = "duration"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
  { value = "4:3", label = "4:3" },
  { value = "3:4", label = "3:4" },
]

[params.resolution]
label = "Resolution"
type = "select"
default = "1080P"
options = [
  { value = "720P", label = "720P" },
  { value = "1080P", label = "1080P" },
]

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 2
max = 15

[params.negative_prompt]
label = "Negative Prompt"
type = "text"

[params.prompt_extend]
label = "Prompt Extend"
type = "boolean"
default = true

[params.watermark]
label = "Watermark"
type = "boolean"
default = false

[params.seed]
label = "Seed"
type = "integer"
