id = "bytedance-seedance-2-5-text-to-video"
label = "Seedance 2.5 (text to video)"
category = "VID"
platform = "oxen"
endpoint = "bytedance-seedance-2-5-text-to-video"
api_path = "api/ai/queue"
mode = "async"
payload_style = "flat"
description = "Seedance 2.5: text-to-video with synchronised audio, 4-30 s, up to 4k."

[pricing]
note = "unset — read pricing from GET /api/ai/models/bytedance-seedance-2-5-text-to-video before shipping"

[general]
kind = "video"
prompt = "required"
image_url_param = "input_image"
duration_param_name = "duration"

[params.generate_audio]
label = "Generate Audio"
type = "boolean"
default = true

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "adaptive", label = "adaptive" },
  { value = "21:9", label = "21:9" },
  { value = "16:9", label = "16:9" },
  { value = "4:3", label = "4:3" },
  { value = "1:1", label = "1:1" },
  { value = "3:4", label = "3:4" },
  { value = "9:16", label = "9:16" },
]

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 4
max = 30

[params.resolution]
label = "Resolution"
type = "select"
default = "720p"
options = [
  { value = "480p", label = "480p" },
  { value = "720p", label = "720p" },
  { value = "1080p", label = "1080p" },
  { value = "4k", label = "4k" },
]
note = "A draft preview is always 480p. A final rendered from a draft is 1080p or 4k; 1080p and 4k output use 10-bit colour and H.265/HEVC encoding."

[params.output_format]
label = "Output Format"
type = "select"
default = "mp4"
options = [
  { value = "mp4", label = "mp4" },
  { value = "mov", label = "mov" },
]

[params.draft]
label = "Draft (480p preview)"
type = "boolean"
default = false
note = "Renders a 480p preview and returns a draft id valid for seven days. Finish it with draft_task_id and 1080p or 4k."

[params.watermark]
label = "Watermark"
type = "boolean"
default = false
